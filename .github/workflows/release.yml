name: Release

# A tag like v1.0.0 builds the image, checks it, publishes it to GHCR and deploys it.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  image:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: docker/setup-buildx-action@v3
      # Image names must be lower case; the repository owner may not be.
      - name: Image name in lower case
        run: echo "IMAGE_LC=${IMAGE,,}" >> "$GITHUB_ENV"
      - name: Build the image (not pushed yet)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE_LC }}:candidate
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test, size, non-root, health, docker stop
        run: bash .github/scripts/docker-smoke.sh "$IMAGE_LC:candidate" "${{ github.sha }}"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish ${{ github.ref_name }} and latest
        run: |
          docker tag "$IMAGE_LC:candidate" "$IMAGE_LC:${{ github.ref_name }}"
          docker tag "$IMAGE_LC:candidate" "$IMAGE_LC:latest"
          docker push "$IMAGE_LC:${{ github.ref_name }}"
          docker push "$IMAGE_LC:latest"

  deploy:
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      RENDER_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      PUBLIC_URL: ${{ vars.PUBLIC_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Image name in lower case
        run: echo "IMAGE_LC=${IMAGE,,}" >> "$GITHUB_ENV"

      # Hosting option A: Render. Needs the secret RENDER_DEPLOY_HOOK_URL (the "Deploy Hook" URL in
      # the service settings); it deploys exactly the image tag of this release from GHCR.
      - name: Deploy to Render
        if: env.RENDER_HOOK != ''
        run: curl -fsS -X POST "${RENDER_HOOK}&imgURL=${IMAGE_LC}:${{ github.ref_name }}"

      # Hosting option B: Fly.io. Needs the secret FLY_API_TOKEN and the fly.toml of this repository.
      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: env.FLY_API_TOKEN != ''
      - name: Deploy to Fly.io
        if: env.FLY_API_TOKEN != ''
        run: flyctl deploy --image "${IMAGE_LC}:${{ github.ref_name }}"

      # The proof that the right build is live: /health shows the git SHA of the build, and it must
      # be the SHA of the commit this tag points to. PUBLIC_URL is a repository VARIABLE
      # (Settings > Secrets and variables > Actions > Variables), e.g. https://dogfight.onrender.com
      - name: Wait until the live /health shows this commit
        run: |
          if [ -z "$PUBLIC_URL" ]; then echo "PUBLIC_URL is not set: skipping the live check"; exit 0; fi
          for i in $(seq 1 40); do
            sha=$(curl -fsS "$PUBLIC_URL/health" | jq -r .gitSha || true)
            echo "attempt $i: live gitSha=$sha, expected ${{ github.sha }}"
            [ "$sha" = "${{ github.sha }}" ] && exit 0
            sleep 10
          done
          echo "the live server does not run this commit"; exit 1

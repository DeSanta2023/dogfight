# Optional hosting on Fly.io:  fly launch --no-deploy --copy-config   then set FLY_API_TOKEN in GitHub.
app = "dogfight"           # change: names are global
primary_region = "ams"

[build]
  image = "ghcr.io/desanta2023/dogfight:latest"

[env]
  PORT = "3000"
  TRUST_PROXY = "1"
  # ALLOWED_ORIGINS = "https://dogfight.fly.dev"   # set to your public https address

# One machine, always on: all the players of a room must be in ONE process (README: why one process).
[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/ready"
    interval = "15s"
    timeout = "3s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"

# docker stop equivalent: SIGTERM, then 10 s, then SIGKILL (the server finishes in well under 1 s)
kill_signal = "SIGTERM"
kill_timeout = 10
